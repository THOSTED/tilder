# The theme's own values, under the site's site.toml (docs/theme.md).

# build.py --check: the colour pairs of style.css that carry text, each
# checked in the light and the dark scheme against contrast_min (WCAG AA).
[check]
contrast = [
	["--fg", "--bg"], ["--fg", "--bg-inset"],
	["--fg-muted", "--bg"], ["--fg-muted", "--bg-inset"],
	["--accent", "--bg"], ["--accent", "--bg-inset"],
	["--warn", "--bg"], ["--warn", "--bg-inset"],
	["--error", "--bg"], ["--error", "--bg-inset"],
]

# D2 diagrams (docs/theme.md, "Diagrams"): D2's colour codes take the
# tokens of style.css, so a drawing follows the light and the dark scheme
# like the page. N: neutrals, from text (N1) to background (N7); B: the
# shapes' borders (B1) to fills (B6); AA, AB: the accents.
[diagrams.d2]
N1 = "--fg"
N2 = "--fg-muted"
N3 = "--fg-muted"
N4 = "--rule"
N5 = "--bg-inset"
N6 = "--bg-inset"
N7 = "--bg"
B1 = "--fg"
B2 = "--fg-muted"
B3 = "--rule"
B4 = "--bg-inset"
B5 = "--bg"
B6 = "--bg"
AA2 = "--accent"
AA4 = "--bg-inset"
AA5 = "--bg"
AB4 = "--bg-inset"
AB5 = "--bg"
