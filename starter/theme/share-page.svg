<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
	<!-- The link preview of each page but the landing one, 1200x630, drawn
	     to previews/<key>.png at every build (docs/theme.md, "Share
	     previews"). The page's fields are fitted by character count
	     ([share] title_columns, detail_columns): a monospace face keeps
	     them inside the card. Remove this file for one preview, share.png,
	     on every page. -->
	<rect width="1200" height="630" fill="{{ share.background_color }}"/>
	<g font-family="monospace" fill="{{ share.muted_color }}" font-size="22">
		<text x="80" y="88">{{ man }}</text>
		<text x="1120" y="88" text-anchor="end">{{ manual_upper }}</text>
		<text x="1120" y="566" text-anchor="end">{{ url }}</text>
	</g>
	<path d="M80 110.5 H1120 M80 530.5 H1120" stroke="{{ share.rule_color }}" stroke-width="2"/>
	<image x="80" y="178" width="160" height="160" href="{{ logo }}"/>
	<text x="290" y="200" font-family="monospace" font-weight="700" font-size="34" fill="{{ share.text_color }}">~/{{ wordmark }}<tspan fill="{{ share.muted_color }}" font-weight="400">{{ path }}</tspan></text>
	<g font-family="monospace" font-weight="700" font-size="60" fill="{{ share.text_color }}">
		<text x="288" y="282">{{ title_1 }}</text>
		<text x="288" y="350">{{ title_2 }}</text>
	</g>
	<g transform="translate(0 {{ title_shift }})">
		<g font-family="monospace" font-size="28" fill="{{ share.text_color }}">
			<text x="290" y="398">{{ detail_1 }}</text>
			<text x="290" y="438">{{ detail_2 }}</text>
		</g>
		<g display="{{ tag_display }}">
			<rect x="290" y="462" width="{{ tag_width }}" height="48" fill="none" stroke="{{ share.theme_color }}" stroke-width="2"/>
			<text x="306" y="495" font-family="monospace" font-weight="700" font-size="24" fill="{{ share.theme_color }}">{{ tag }}</text>
		</g>
	</g>
</svg>
