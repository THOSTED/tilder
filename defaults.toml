# Defaults for every key the builder reads, except a type's own
# (types/<type>.py). A project's content/site.toml is merged over this
# file: it only needs what differs. The values here are English and
# neutral; a site in another language overrides the words.

[site]
name = "my site"                    # wordmark, feed and calendar names
url = "https://example.org"         # canonical origin, no trailing slash
lang = "en"
locale = "en_GB"                    # Open Graph
manual = "My Site Manual"           # centre of the man-page header rule
updated = 2026-01-01                # date in the footer rule and the feeds
title_suffix = " - my site"         # appended to every <title> that lacks the name
languages = []                      # every language served, the default (lang) first;
                                    # empty: one language, no prefix (docs/languages.md)

[footer]
left = "SITE"                       # links to footer.left_link
left_link = ""
right = "SITE(1)"

[labels]
skip = "skip to content"
nav = "Main navigation"
info = "INFO"
warning = "WARNING"
error = "ERROR"
image = "image"                     # text mirror: [ image ] alt text
diagram = "diagram"                 # text mirror: [ diagram ] description
map_alt = "Map of {place}"          # an event's static map, [maps]; {place}: its place
map_attribution = "© OpenStreetMap contributors"   # under the map, linking to maps.attribution_url
task_done = "done"                  # task lists, read by screen readers
task_todo = "to do"
to_top = "↑ back to top"
copy = "copy"                       # the button on code blocks
copied = "copied"
external = "external site"          # read after an external link, instead of the arrow
new_tab = "opens in a new tab"      # said by screen readers
table = "table"                     # names a scrollable table region
toc = "contents"                    # the [TOC] block
website = "website"                 # a member's own site, in the profile links
languages = "Languages"             # the language switcher, {{ languages }}
collection_nav = "In this section"  # names the {{ collection_nav }} sidebar; a collection may set nav_label
prev = "previous"                   # {{ prev }}, and the text mirror's line of a sequential type
next = "next"                       # {{ next }}

# External links: open in a new tab or not. `same_tab` lists hosts (and
# their subdomains) that stay in the same tab when new_tab is on.
[links]
new_tab = false
same_tab = []

# The names the language switcher shows, by code: en = "English". A language
# without a name shows its code.
[languages]

# The navigation, in order. `href` is written from the site root ("" is the
# landing page); `https://` links are external.
[[nav]]
label = "home"
href = ""

[seo]
organization = "My Site"            # the publisher, in structured data
same_as = []                        # its official profiles elsewhere, absolute
                                    # http(s) URLs: the Organization's sameAs
robots = "index, follow, max-image-preview:large"
title_max = 60                      # build warnings past these limits
description_min = 50
description_max = 160

# Static maps on event pages: for an event with lat and lon, the build
# fetches a few tiles around the point and draws them, with a marker, to
# maps/<key>.png - visitors load nothing from another host. Opt-in: the
# build then asks a tile server, whose usage policy the site accepts
# (OpenStreetMap's: https://operations.osmfoundation.org/policies/tiles/).
# Tiles are cached in TILDER_CACHE; a fetch that fails keeps the map link.
[maps]
enabled = false
tiles = "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
attribution_url = "https://www.openstreetmap.org/copyright"
zoom = 16
width = 720                         # px, the map's size
height = 360
marker = ""                         # the marker's colour; empty: share.theme_color
max_age_days = 30                   # a cached tile is fetched again after this

# D2 diagrams (```d2 blocks), drawn at build time by the D2 CLI; usually
# set by a theme, in theme.toml. [diagrams.d2] maps D2's colour codes
# (N1-N7, B1-B6, AA2, AA4, AA5, AB4, AB5) to tokens of style.css: each
# takes the token's light value, and its dark value under
# prefers-color-scheme: dark. The fonts are files of theme/fonts/ (WOFF2
# is decompressed to TTF); empty: D2's own. italic falls back to regular,
# semibold to bold.
[diagrams]
layout = "dagre"                    # or "elk", both inside D2
pad = 16                            # px around a drawing
font_regular = ""
font_italic = ""
font_bold = ""
font_semibold = ""

[diagrams.d2]

# Link previews and icons. The PNG and ICO files are made from assets/logo.svg
# at every build; share.png from the theme's share.svg, filled from here.
[share]
logo_svg = "logo.svg"               # the source of every icon, in assets/
image = "share.png"                 # the default preview, 1200x630, generated
logo = "icon-512.png"               # the logo in structured data, generated
image_alt = "my site"
card = ["a man-page website"]       # the preview's lines under the name, one or two
theme_color = "#0F6E68"             # browser UI, the web manifest, the preview
background_color = "#FDF6E3"
text_color = "#073642"
muted_color = "#506C75"
rule_color = "#DED7C3"
short_name = "site"                 # web manifest
# A preview per page, when the theme has share-page.svg (or share-<type>.svg):
# previews/<key>.png, drawn from the page's title, tagline, place or
# author, and tag. The landing page, noindex pages and pages that set
# image: keep their image. Text is fitted by character count (the template
# is meant for a monospace face) and cut with "...".
pages = true
title_columns = 23                  # characters per title line
title_lines = 2
title_line_height = 68              # {{ title_shift }}: this, per unused title line
detail_columns = 48                 # characters per detail line
# {{ tags }}: the post's tag and the page's share_tags, each in a box, on
# tag_lines lines of tag_room px (a second only under a one-line title).
tag_advance = 14.4                  # px per character of a tag
tag_padding = 16                    # px inside the box, on each side of the text
tag_height = 48                     # px, a box
tag_baseline = 33                   # px, from a box's top to its text's baseline
tag_gap = 14                        # px between two boxes
tag_line_gap = 12                   # px between two lines of boxes
tag_lines = 2
tag_room = 830                      # px, the width of a line of boxes

# Collections: a folder under content/ whose files are items of one type.
# A site declares its own as [collections.<name>]: a `type` (page, post,
# event, member, or one the theme adds in theme/types/), a `dir` under
# content/ (default: the name), and whatever differs from the type's
# defaults - every type's words and settings are listed in its module,
# types/<type>.py (DEFAULTS), and documented in docs/types.md. A collection
# whose folder does not exist is simply empty: no page, no feed. Lists are
# shown by section markers: {posts}, {upcoming}, {past}, {next-event},
# {members}, each with an optional collection name - {upcoming:meetups}.
#
# The three collections most sites have. Inactive until content/blog/,
# content/events/ or content/members/ exists. A post dated after the
# build's date (BUILD_TODAY, else the day) is published on that date, not
# before; `scheduled = false` under [collections.blog] publishes it now.

[collections.blog]
type = "post"
dir = "blog"
feed = "blog/feed.xml"

[collections.events]
type = "event"
dir = "events"
nav = "events"
feed = "events.xml"
calendar = "calendar.ics"

[collections.members]
type = "member"
dir = "members"

[dates]
weekdays = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"]
months = ["January", "February", "March", "April", "May", "June", "July",
          "August", "September", "October", "November", "December"]
first = "1"                         # the first day of a month
format = "{weekday} {day} {month} {year}"

# Settings shared by every iCalendar feed ([collections.*] calendar).
[calendar]
name = "events"
description = "Events."
prodid = "-//site//events//EN"
timezone = "UTC"
uid_domain = "example.org"

# The text mirror, coloured for terminals (ansi/): commands, the words that
# start a command line worth highlighting; accent, the one accent colour
# (links, [ tags ], list markers, inline code, command lines, the INFO box):
# one of the eight colour names black, red, green, yellow, blue, magenta,
# cyan, white, or a 256-colour index from 16 to 255, such as 208 for orange.
[text]
commands = ["curl"]
accent = "cyan"

[robots]
disallow = ["/txt/", "/ansi/"]      # the text mirrors

[robots_man]
disallow = ["/"]

# build.py --check (docs/theme.md, "Checking a theme"): a theme sets these
# in its theme.toml.
[check]
unstyled = []                       # classes of the contract the theme leaves unstyled on purpose
contrast = []                       # pairs of style.css colours, [["--text", "--bg"], ...]; empty: not checked
contrast_min = 4.5                  # the least contrast ratio of every pair (WCAG AA for text)
