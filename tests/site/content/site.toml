# The fixture site of the tests. English, neutral, no real person or site.

[site]
name = "test site"
url = "https://test.example"
lang = "en"
locale = "en_GB"
manual = "Test Site Manual"
updated = 2026-06-01
title_suffix = " - test site"
languages = ["en", "fr"]        # the default first; fr is served under /fr/

[footer]
left = "TESTS"
left_link = ""
right = "TEST(1)"

[[nav]]
label = "home"
href = ""

[[nav]]
label = "events"
href = "events"

[[nav]]
label = "blog"
href = "blog/"

[[nav]]
label = "members"
href = "members"

[seo]
organization = "Test Site"

[share]
image_alt = "~/test site"
card = ["a fixture"]
short_name = "test"
background_color = "#ABCDEF"

[languages]                     # names shown by the language switcher
en = "English"
fr = "Français"

[collections.blog]
type = "post"
feed = "blog/feed.xml"

[collections.events]
type = "event"
feed = "events.xml"
calendar = "events.ics"

# Declared, no folder: must produce nothing and fail nothing.
[collections.news]
type = "post"
dir = "news"

[collections.members]
type = "member"
categories = ["admin", "mentor", "member"]

[collections.talks]
type = "talk"
feed = "talks.xml"

[collections.guides]
type = "guide"
nav_label = "Guide contents"

[collections.manual]
type = "guide"
recursive = true
nav = "manual/"
man = "TEST-MANUAL(7)"
index = "manual/index.json"
