# Serve a man-page site with Docker. Copy next to your content/, theme/ and
# assets/, with builder/ as a folder or a submodule, and examples/Caddyfile
# as ./Caddyfile.
#
#   docker compose up -d
#   http://site.localhost:8080        the site
#   http://man.site.localhost:8080    the plain-text mirror
#
# `build` renders the site into the `site` volume at start-up, then watches
# the sources and rebuilds on every change and at midnight. `web` starts
# after the first render and serves the volume.

services:
  build:
    # The published image holds the generator: no submodule needed. Pin a
    # major (`:1`) or a version (`:1.2.3`).
    image: ghcr.io/thosted/tilder:1
    volumes:
      - ./content:/site/content:ro
      - ./theme:/site/theme:ro
      - ./assets:/site/assets:ro
      - site:/out
    # With the generator as a submodule in ./builder instead, build the
    # image locally and mount the code:
    #   build: ./builder
    #   command: ["python3", "-B", "/site/builder/build.py", "--root", "/site", "--out", "/out", "--watch"]
    #   volumes: the four above, plus ./builder:/site/builder:ro
    healthcheck:
      test: ["CMD", "test", "-f", "/out/index.html"]
      interval: 30s
      start_period: 30s
      start_interval: 1s

  web:
    image: caddy:2-alpine
    depends_on:
      build:
        condition: service_healthy
    ports:
      - "8080:80"
      - "8081:81"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - site:/srv:ro
    environment:
      # In production: SITE_HOST=example.org, WWW_HOST=www.example.org,
      # MAN_HOST=man.example.org, SITE_ORIGIN=https://example.org, AUTO_HTTPS=on
      SITE_HOST: ${SITE_HOST:-http://site.localhost}
      WWW_HOST: ${WWW_HOST:-http://www.site.localhost}
      MAN_HOST: ${MAN_HOST:-http://man.site.localhost}
      SITE_ORIGIN: ${SITE_ORIGIN:-http://site.localhost:8080}
      AUTO_HTTPS: ${AUTO_HTTPS:-off}

volumes:
  site:
